<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>传染病暴发调查与接触网络</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 960px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    button { padding: .5rem .8rem; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin: .5rem 0 1rem; }
    th, td { border: 1px solid #d1d5db; padding: .35rem .6rem; text-align: left; font-size: .9rem; }
    th { background: #f9fafb; }
    fieldset { border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 1rem; }
    legend { font-weight: 600; }
    input { padding: .3rem .5rem; margin: .15rem; }
    .chain { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .pending { color: #b45309; font-weight: 600; }
  </style>
</head>
<body>
<main>
  <h1>传染病暴发调查与接触网络</h1>
  <p>
    <button onclick="checkHealth()">检查服务状态</button>
    <button onclick="loadChains()">刷新传播链</button>
  </p>
  <pre id="result">等待操作</pre>

  <h2>调查操作</h2>
  <fieldset>
    <legend>创建病例</legend>
    <input id="case_person" placeholder="人员ID">
    <input id="case_onset" placeholder="发病日期 2026-03-01">
    <input id="case_location" placeholder="地点">
    <input id="case_symptoms" placeholder="症状,逗号分隔">
    <button onclick="createCase()">创建</button>
  </fieldset>
  <fieldset>
    <legend>确认病例（分诊 + 实验室阳性）</legend>
    <input id="confirm_case" placeholder="病例ID">
    <input id="confirm_lab" placeholder="实验室ID">
    <button onclick="confirmCase()">确认</button>
  </fieldset>
  <fieldset>
    <legend>登记暴露（来源病例、暴露时间地点）</legend>
    <input id="exp_case" placeholder="病例ID">
    <input id="exp_source" placeholder="来源病例ID">
    <input id="exp_date" placeholder="暴露时间 2026-02-25">
    <input id="exp_location" placeholder="暴露地点">
    <button onclick="registerExposure()">登记</button>
  </fieldset>
  <fieldset>
    <legend>创建接触者</legend>
    <input id="contact_case" placeholder="关联病例ID">
    <input id="contact_person" placeholder="人员ID">
    <input id="contact_exposure" placeholder="暴露开始 2026-02-25">
    <button onclick="createContact()">创建</button>
  </fieldset>
  <fieldset>
    <legend>解除接触者（未感染）</legend>
    <input id="release_contact" placeholder="接触者ID">
    <input id="release_outcome" placeholder="结局，如 no symptoms">
    <button onclick="releaseContact()">解除</button>
  </fieldset>

  <h2>传播链</h2>
  <div id="chains">尚未加载</div>

  <h2>常用接口</h2>
  <pre>GET  /health
GET  /api/&lt;kind&gt;
POST /api/&lt;kind&gt;
GET  /api/entities/&lt;id&gt;
POST /api/entities/&lt;id&gt;/actions
GET  /api/chains
GET  /api/chains/&lt;case_id&gt;</pre>
</main>
<script>
const HEADERS = {"Content-Type": "application/json", "X-User-Id": "demo-investigator", "X-Role": "admin"};

async function api(path, options) {
  const response = await fetch(path, options);
  const payload = await response.json();
  if (!response.ok) throw new Error(payload.error || response.statusText);
  return payload;
}

function show(value) {
  document.getElementById('result').textContent =
    typeof value === 'string' ? value : JSON.stringify(value, null, 2);
}

async function run(action) {
  try {
    show(await action());
    await loadChains();
  } catch (error) {
    show("操作失败：" + error.message);
  }
}

async function checkHealth() {
  show(await api('/health'));
}

function val(id) { return document.getElementById(id).value.trim(); }

function post(path, body) {
  return api(path, {method: 'POST', headers: HEADERS, body: JSON.stringify(body)});
}

function act(id, action, data) {
  return post('/api/entities/' + id + '/actions', {action: action, data: data});
}

async function createCase() {
  return run(() => post('/api/case', {
    person_id: val('case_person'),
    onset_date: val('case_onset'),
    location: val('case_location'),
    symptoms: val('case_symptoms').split(',').map(s => s.trim()).filter(Boolean),
  }));
}

async function confirmCase() {
  const id = val('confirm_case');
  return run(async () => {
    await act(id, 'triage', {clinician: 'demo-clinician'}).catch(() => null);
    return act(id, 'lab_positive', {lab_id: val('confirm_lab') || 'L-1', result: 'positive'});
  });
}

async function registerExposure() {
  return run(() => act(val('exp_case'), 'register_exposure', {
    source_case_id: val('exp_source'),
    exposure_date: val('exp_date'),
    exposure_location: val('exp_location'),
  }));
}

async function createContact() {
  return run(() => post('/api/contact', {
    case_id: val('contact_case'),
    person_id: val('contact_person'),
    exposure_start: val('contact_exposure'),
  }));
}

async function releaseContact() {
  return run(() => act(val('release_contact'), 'release', {outcome: val('release_outcome')}));
}

function esc(value) {
  return String(value == null ? '' : value)
    .replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
}

function renderChain(chain) {
  const members = chain.members.map(m => `<tr>
    <td>第${m.generation}代</td><td>${esc(m.case_id)}</td><td>${esc(m.person_id)}</td>
    <td>${esc(m.status)}</td><td>${esc(m.onset_date)}</td>
    <td>${esc(m.source_case_id || '—')}</td><td>${esc(m.exposure_date || '—')}</td>
    <td>${esc(m.exposure_location || '—')}</td>
  </tr>`).join('');
  const contacts = chain.contacts.map(c => `<tr>
    <td>${esc(c.contact_id)}</td><td>${esc(c.person_id)}</td><td>${esc(c.case_id)}</td>
    <td>${esc(c.status)}</td><td>${c.pending ? '<span class="pending">待处理</span>' : '已处理'}</td>
  </tr>`).join('');
  const pending = chain.pending_contacts.map(c => esc(c.contact_id)).join('、') || '无';
  return `<div class="chain">
    <h3>链 ${esc(chain.chain_id)}（${chain.size} 人）</h3>
    <table>
      <thead><tr><th>代际</th><th>病例</th><th>人员</th><th>状态</th><th>发病日期</th><th>来源病例</th><th>暴露时间</th><th>暴露地点</th></tr></thead>
      <tbody>${members}</tbody>
    </table>
    <p>待处理接触者：<span class="pending">${pending}</span></p>
    ${contacts ? `<table>
      <thead><tr><th>接触者</th><th>人员</th><th>关联病例</th><th>状态</th><th>是否待处理</th></tr></thead>
      <tbody>${contacts}</tbody>
    </table>` : ''}
  </div>`;
}

async function loadChains() {
  const host = document.getElementById('chains');
  try {
    const payload = await api('/api/chains');
    host.innerHTML = payload.items.length
      ? payload.items.map(renderChain).join('')
      : '<p>暂无传播链</p>';
  } catch (error) {
    host.textContent = '加载失败：' + error.message;
  }
}

loadChains();
</script>
</body>
</html>
